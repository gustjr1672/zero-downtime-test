version: '3.8'

services:
  nginx-proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    # Nginx는 API 컨테이너들과 같은 네트워크를 씁니다.

  api-blue:
    image: zero-api:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "8080:8080" # 외부 헬스체크용 포트 개방

  api-green:
    image: zero-api:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "8081:8080" # 외부 헬스체크용 포트 개방